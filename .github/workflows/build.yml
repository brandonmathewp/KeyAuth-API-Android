name: Android NDK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '29.0.14033849'

    - name: Build Fat Static Library and Example
      run: |
        set -e

        # ------------------------------------------------------------
        # 1. Environment Setup
        # ------------------------------------------------------------
        NDK_ROOT="$ANDROID_NDK_ROOT"
        LLVM_BIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export PATH="$NDK_ROOT:$LLVM_BIN:$PATH"
        LLVM_AR="$LLVM_BIN/llvm-ar"

        # ------------------------------------------------------------
        # 2. Build Core Library
        # ------------------------------------------------------------
        echo "[*] Building Core Library..."
        cd KeyAuth_Library
        ndk-build -B
        cd ..

        # ------------------------------------------------------------
        # 3. Build Fat Static Library (Including Dependencies)
        # ------------------------------------------------------------
        echo "[*] Merging dependencies into fat library..."
        FAT_DIR="$PWD/fat_temp"
        LIBS_DIR="$PWD/KeyAuth_Library/jni/libs_vcpkg"
        mkdir -p "$FAT_DIR"

        # List all libraries to merge
        ALL_LIBS=(
            "$PWD/KeyAuth_Library/obj/local/arm64-v8a/libkeyauth.a"
            "$LIBS_DIR/libcurl.a"
            "$LIBS_DIR/libsodium.a"
            "$LIBS_DIR/libssl.a"
            "$LIBS_DIR/libcrypto.a"
        )

        for lib in "${ALL_LIBS[@]}"; do
            if [ -f "$lib" ]; then
                echo "  Extracting: $(basename "$lib")"
                mkdir -p "$FAT_DIR/$(basename "$lib")"
                (cd "$FAT_DIR/$(basename "$lib")" && "$LLVM_AR" x "$lib")
            else
                echo "  Warning: $lib not found, skipping"
            fi
        done
        
        find "$FAT_DIR" -name "*.o" -type f > "$PWD/objs.txt"
        "$LLVM_AR" rc libkeyauth.a @"$PWD/objs.txt"
        rm -rf "$FAT_DIR" "$PWD/objs.txt"

        # ------------------------------------------------------------
        # 4. Prepare Example Project
        # ------------------------------------------------------------
        mkdir -p KeyAuth_Example/jni/libs/arm64-v8a
        cp -f libkeyauth.a KeyAuth_Example/jni/libs/arm64-v8a/

        echo "[*] Building Example Project..."
        cd KeyAuth_Example
        ndk-build -B
        cd ..

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: keyauth-build-outputs
        path: |
          libkeyauth.a
          KeyAuth_Example/libs/arm64-v8a/*.so
