name: Android NDK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '29.0.14033849'

    - name: Build Fat Static Library and Example
      run: |
        set -e

        # ------------------------------------------------------------
        # 1. Verify and Set Up NDK Environment
        # ------------------------------------------------------------
        NDK_ROOT="$ANDROID_NDK_ROOT"
        export PATH="$NDK_ROOT:$NDK_ROOT/prebuilt/linux-x86_64/bin:$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

        # ------------------------------------------------------------
        # 2. Build core library
        # ------------------------------------------------------------
        echo "[*] Building Core Library (KeyAuth_Library)..."
        cd KeyAuth_Library
        ndk-build -B
        cd ..

        # ------------------------------------------------------------
        # 3. Merge dependencies into fat static library (Simplified logic)
        # ------------------------------------------------------------
        echo "[*] Merging dependencies into fat library..."
        FAT_DIR="$PWD/fat_temp"
        NEW_CORE_LIB="$PWD/KeyAuth_Library/obj/local/arm64-v8a/libkeyauth.a"
        mkdir -p "$FAT_DIR"
        
        # Extract and bundle objects
        LLVM_AR="llvm-ar"
        mkdir -p "$FAT_DIR/core" && (cd "$FAT_DIR/core" && "$LLVM_AR" x "$NEW_CORE_LIB")
        
        find "$FAT_DIR" -name "*.o" -type f > "$PWD/objs.txt"
        "$LLVM_AR" rc libkeyauth.a @"$PWD/objs.txt"
        rm -rf "$FAT_DIR" "$PWD/objs.txt"

        # ------------------------------------------------------------
        # 4. Copy outputs to Example directory
        # ------------------------------------------------------------
        mkdir -p KeyAuth_Example/jni/libs/arm64-v8a
        cp -f libkeyauth.a KeyAuth_Example/jni/libs/arm64-v8a/

        # ------------------------------------------------------------
        # 5. Build example project (Generates the .so)
        # ------------------------------------------------------------
        echo "[*] Building Example Project..."
        cd KeyAuth_Example
        ndk-build -B
        cd ..

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: keyauth-build-outputs
        path: |
          libkeyauth.a
          KeyAuth_Example/libs/arm64-v8a/*.so
