name: Android NDK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Android NDK
      uses: android-actions/setup-android@v3
      with:
        ndk-version: '29.0.14033849'

    - name: Run Build Logic
      run: |
        set -e
        # Set up NDK environment paths
        export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
        PREBUILT_DIR="$ANDROID_NDK_ROOT/prebuilt/linux-x86_64/bin"
        LLVM_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export PATH="$ANDROID_NDK_ROOT:$PREBUILT_DIR:$LLVM_BIN:$PATH"
        LLVM_AR="$LLVM_BIN/llvm-ar"

        # Build Core
        cd KeyAuth_Library
        ndk-build -B
        cd ..

        # Merge dependencies (Matching your build.sh logic)
        FAT_DIR="$PWD/fat_temp"
        NEW_CORE_LIB="$PWD/KeyAuth_Library/obj/local/arm64-v8a/libkeyauth.a"
        LIBS_VCPKG="$PWD/KeyAuth_Library/jni/libs_vcpkg"
        rm -rf "$FAT_DIR"
        mkdir -p "$FAT_DIR"

        if [ -d "$LIBS_VCPKG" ]; then
            echo "[*] Found libs_vcpkg, extracting dependencies..."
            LIBS=("$NEW_CORE_LIB" "$LIBS_VCPKG"/lib{curl,sodium,ssl,crypto,z}.a)
            for lib in "${LIBS[@]}"; do
                if [ -f "$lib" ]; then
                    name=$(basename "$lib" .a)
                    mkdir -p "$FAT_DIR/$name"
                    (cd "$FAT_DIR/$name" && "$LLVM_AR" x "$lib")
                fi
            done
        else
            echo "[*] No libs_vcpkg found, using core lib only."
            mkdir -p "$FAT_DIR/core"
            (cd "$FAT_DIR/core" && "$LLVM_AR" x "$NEW_CORE_LIB")
        fi

        # Create final fat lib
        find "$FAT_DIR" -name "*.o" -type f | sed 's/^\.\///' > "$PWD/objs.txt"
        "$LLVM_AR" rc libkeyauth.a @"$PWD/objs.txt"
        rm -rf "$FAT_DIR" "$PWD/objs.txt"

        # Setup Example
        mkdir -p KeyAuth_Example/jni/libs/arm64-v8a
        cp -f libkeyauth.a KeyAuth_Example/jni/libs/arm64-v8a/

        # Build Example
        cd KeyAuth_Example
        ndk-build -B
        cd ..

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: keyauth-build-outputs
        path: |
          libkeyauth.a
          KeyAuth_Example/libs/arm64-v8a/*.so
